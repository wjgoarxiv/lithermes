  const heroL = [];

  const endName = riseLine(root, COPY.name, "pre b4", { left: "0px", top: "640px", width: "1920px", textAlign: "center", fontSize: "60px", lineHeight: "1.1", color: QUIET, zIndex: "4" });

  // ---------- layout (measured once, after fonts are ready) ----------
  let L = null;
  function layout() {
    const wordW = heroL.reduce((a, e) => a + e.getBoundingClientRect().width, 0);
    const lw = heroL.map((e) => e.getBoundingClientRect().width);
    const caretW = Math.round(H * 0.2), caretH = Math.round(H * 0.74);
    const totalW = wordW + caretW + 14;
    const hx = Math.round((1920 - totalW) / 2), hBase = 610;

    const hb = heroBase.getBoundingClientRect(), hr = hero.getBoundingClientRect();
    const bh = hb.bottom - hr.top;
    const hy = hBase - bh;
    css(heroGroup, { left: px(hx), top: px(hy) });
    css(heroCaret, { width: px(caretW), height: px(caretH), left: "0px", top: px(bh - caretH) });

    const sb = slotBase.getBoundingClientRect();
    litSlot.removeChild(slotBase);
    const tx = sr.left, tBase = sb.bottom, tw = sr.width;
    const s = tw / wordW;
    // typed rest position and caret
    const rr = restSlot.getBoundingClientRect();
    // words of beat 2
    const gap = CFG.wordGap;
    const ww = wordEls.map((e) => e.getBoundingClientRect().width);
    const totalWords = ww.reduce((a, b) => a + b, 0) + gap * 2;
    let cx = Math.round((1920 - totalWords) / 2);
    const wx = ww.map((w) => { const v = cx; cx += w + gap; return v; });
    const wBase = 560;
    const wb = mk("i", null, wordEls[0]); css(wb, { display: "inline-block", width: "0px", height: "0px" });
    const wbb = wb.getBoundingClientRect(), wr0 = wordEls[0].getBoundingClientRect();
    const wbh = wbb.bottom - wr0.top; wordEls[0].removeChild(wb);
    wordEls.forEach((e, i) => css(e, { left: px(wx[i]), top: px(wBase - wbh) }));
    const trackY = 700;
    const nodeX = wx.map((x, i) => x + ww[i] / 2);
    css(trackBase, { left: px(nodeX[0]), width: px(nodeX[2] - nodeX[0]), top: px(trackY - 1) });
    nodes.forEach((n, i) => css(n, { left: px(nodeX[i] - 13), top: px(trackY - 13) }));
    tickRing.setAttribute("cx", nodeX[2]); tickRing.setAttribute("cy", trackY); tickRing.setAttribute("r", 34);
    tickPath.setAttribute("d", `M${nodeX[2] - 17} ${trackY + 1} L${nodeX[2] - 4} ${trackY + 15} L${nodeX[2] + 19} ${trackY - 14}`);
    // ack flame position (ember birth)
    const fr = ackFlameR.getBoundingClientRect();
    // card and beat 4 geometry
    const cl = card.getBoundingClientRect();
    // typed caret geometry for the prompt (line box)
    const pl = promptLine.getBoundingClientRect();
    // end line
    L = { wordW, lw, caretW, caretH, hx, hy, bh, s, tx, tBase, tw, hBase, wx, ww, wBase, wbh, trackY, nodeX, emberBirth: [fr.left + fr.width / 2, fr.top + fr.height / 2], cardRect: cl, pl, restLeft: rr.left, pTop: pl.top };
    // dimensions for typed caret placement
    const probe = mk("span", null, promptLine, "0000000000"); L.charW = probe.getBoundingClientRect().width / 10; promptLine.removeChild(probe);
    L.lineH = 64;
  }

  // ---------- frame ----------
  function render(t) {
    if (!L) layout();
    // ground light
    css(glowA, { background: `radial-gradient(closest-side, rgba(255,99,55,${0.19 + 0.03 * Math.sin(t * 0.7)}), rgba(255,99,55,0) 100%)` });
    css(glowB, { background: `radial-gradient(closest-side, rgba(215,247,91,${0.055 + 0.015 * Math.sin(t * 0.5 + 1)}), rgba(215,247,91,0) 100%)` });

    // ----- beat 0 -----
    const tl = [0.55, 0.85, 1.15];
    heroL.forEach((e, i) => {
      const p = at(t, tl[i], 0.62, rise);
      e.style.transform = `translateY(${(1 - p) * 105}%)`;
      e.style.visibility = p > 0 ? "" : "hidden";
    });
    // caret follows the typed letters
    const cxs = [0, L.lw[0], L.lw[0] + L.lw[1], L.wordW];
    const caretX = 14 * 0 + kf(t, [
      { t: 0.5, v: cxs[0] }, { t: 0.62, v: cxs[0], ease: "outCubic" }, { t: 0.74, v: cxs[1] },
      { t: 0.92, v: cxs[1], ease: "outCubic" }, { t: 1.04, v: cxs[2] },
      { t: 1.22, v: cxs[2], ease: "outCubic" }, { t: 1.34, v: cxs[3] },
    ]);
    const blink = t < 1.5 ? 1 : (Math.floor((t - 1.5) * 2.4) % 2 === 0 ? 1 : 0.15);
    heroCaret.style.transform = `translateX(${caretX + (t >= 0.5 ? 10 : 0)}px)`;
    heroCaret.style.background = mix(EMBER_CARET, LIME, smoothstep(2.9, 3.6, t));
    heroCaret.style.opacity = t < 2.85 ? String(blink) : String(blink * (1 - at(t, 2.85, 0.35, ease.accelerate)));
    const handP = at(t, 2.85, 1.0, inOut);
    const sc = Math.exp(lerp(0, Math.log(L.s), handP));
    const X = lerp(0, L.tx - L.hx, handP), Y = lerp(0, L.tBase - L.hy - L.s * L.bh, handP);
    heroGroup.style.transform = `translate(${X}px, ${Y}px) scale(${sc})`;
    heroGroup.style.opacity = String(1 - smoothstep(3.62, 3.86, t));
    vis(heroGroup, t < 3.95);
    const subIn = at(t, 1.75, 0.75, rise), subOut = at(t, 2.75, 0.45, ease.accelerate);
    sub1.inner.style.transform = `translateY(${(1 - subIn) * 110 + subOut * 110}%)`;
    vis(sub1.wrap, t > 1.7 && t < 3.3);

    // ----- beat 1 -----
    const paneIn = at(t, 2.9, 0.9, rise);
    const paneOut = at(t, 7.75, 0.55, ease.accelerate);
    pane1.style.opacity = String(paneIn * (1 - paneOut));
    pane1.style.transform = `translateY(${(1 - paneIn) * 34 - paneOut * 24}px) scale(${0.985 + 0.015 * paneIn - 0.03 * paneOut})`;
    vis(pane1, t > 2.85 && t < 8.4);
    litSlot.style.opacity = String(smoothstep(3.62, 3.86, t));
    const restStr = typed(COPY.prompt.slice(3), t, 4.05, 34);
    restSlot.textContent = restStr;
    const promptDone = restStr.length >= COPY.prompt.length - 4;
    const cPos = (COPY.prompt.length - (COPY.prompt.length - 4 - restStr.length)) ;
    // caret sits after the visible characters of the request
    const vChars = 3 + restStr.length;
    const promptOff = L.tx - P1.x - 1; // slot left inside pane, minus the border
    css(promptCaret, { left: px(promptOff + vChars * L.charW + 3), top: px(84 + 9) });
    promptCaret.style.opacity = String(t < 3.7 ? 0 : (promptDone && t > 4.85 ? Math.max(0, 1 - (t - 4.85) / 0.25) : 1));
    // acknowledgement
    ackMark.rowEls.forEach((r, i) => { clipRect(r, at(t, 4.85 + i * 0.07, 0.42, ease.outCubic), { from: "left" }); });
    const ackN = Math.floor(Math.max(0, t - 5.2) * 44);
    ackSpans.forEach((s, i) => { s.style.opacity = i < ackN ? "1" : "0"; });
    const labP = at(t, 5.15, 0.3);
    ackFlameL.style.opacity = String(labP); ackFlameR.style.opacity = String(at(t, 5.8, 0.3));
    const h1In = at(t, 5.2, 0.8, rise), h1Out = at(t, 7.55, 0.45, ease.accelerate);
    head1.inner.style.transform = `translateY(${(1 - h1In) * 112 + h1Out * 112}%)`;
    vis(head1.wrap, t > 5.15 && t < 8.1);

    // ----- ember -----
    const t0e = 7.35, t1e = 8.75;
    const S = L.emberBirth, E = [L.nodeX[0], L.trackY];
    let ex = null, ey = null, eo = 0, es = 1;
    const bezPos = (u) => bez(S, [S[0] + 240, S[1] - 320], [E[0] - 420, E[1] - 260], E, u);
    if (t >= t0e && t < t1e) {
      const u = inOut(clamp((t - t0e) / (t1e - t0e), 0, 1));
      [ex, ey] = bezPos(u); eo = at(t, t0e, 0.25); es = 1 + 0.25 * Math.sin(u * Math.PI);
    } else if (t >= t1e && t < 11.55) {
      const seg = t < 10.3 ? 0 : 1;
      const a = seg === 0 ? [9.15, 10.2] : [10.45, 11.5];
      const u = inOut(clamp((t - a[0]) / (a[1] - a[0]), 0, 1));
      ex = lerp(L.nodeX[seg], L.nodeX[seg + 1], u); ey = L.trackY; eo = 1; es = 1;
    } else if (t >= 12.55 && t < 13.55) {
      const u = inOut(clamp((t - 12.55) / 1.0, 0, 1));
      const C = [L.nodeX[2], L.trackY], D = [1600, 250];
      [ex, ey] = bez(C, [C[0] + 200, C[1] - 380], [D[0] - 260, D[1] - 200], D, u); eo = 1 - smoothstep(13.35, 13.55, t); es = 1 - 0.2 * u;
    }
    if (ex !== null) {
      ember.style.display = ""; ember.style.opacity = String(eo);
      ember.style.transform = `translate(${ex - 13}px, ${ey - 13}px) scale(${es})`;
    } else ember.style.display = "none";
    trail.forEach((d, i) => {
      let tp = null;
      const lag = (i + 1) * 0.045;
      if (ex !== null && t >= t0e && t < t1e) { const u = inOut(clamp((t - lag - t0e) / (t1e - t0e), 0, 1)); tp = bezPos(u); }
      else if (ex !== null && t >= 12.55 && t < 13.55) {
        const u = inOut(clamp((t - lag - 12.55) / 1.0, 0, 1)); const C = [L.nodeX[2], L.trackY], D = [1600, 250]; tp = bez(C, [C[0] + 200, C[1] - 380], [D[0] - 260, D[1] - 200], D, u);
      }
      if (tp) { d.style.display = ""; d.style.opacity = String(0.5 * (1 - i / 8) * eo); d.style.transform = `translate(${tp[0] - (11 - i)}px, ${tp[1] - (11 - i)}px)`; }
      else d.style.display = "none";
    });

    // ----- beat 2 -----
    const wIn = [8.3, 8.45, 8.6];
    wordInner.forEach((e, i) => {
      const inP = at(t, wIn[i], 0.75, rise);
      const outP = at(t, 12.5 + i * 0.07, 0.5, ease.accelerate);
      e.style.transform = `translateY(${(1 - inP) * 140 - outP * 112}%)`;
      e.style.visibility = inP > 0 ? "" : "hidden";
    });
    const lit = [8.7, 10.2, 11.5];
    wordEls.forEach((e, i) => { e.style.color = mix(DIM, IVORY, at(t, lit[i], 0.4, ease.outCubic)); vis(e, t > 8.25 && t < 13.3); });
    const trackOn = t > 8.3 && t < 12.9;
    const trackA = at(t, 8.4, 0.5) * (1 - at(t, 12.5, 0.4));
    [trackBase].forEach((e) => { e.style.opacity = String(trackA); vis(e, trackOn); });
    const doneX = t < 9.15 ? 0 : (t < 10.3 ? lerp(0, L.nodeX[1] - L.nodeX[0], inOut(clamp((t - 9.15) / 1.05, 0, 1))) : lerp(L.nodeX[1] - L.nodeX[0], L.nodeX[2] - L.nodeX[0], inOut(clamp((t - 10.45) / 1.05, 0, 1))));
    css(trackDone, { left: px(L.nodeX[0]), width: px(doneX), top: px(L.trackY - 1), opacity: String(trackA) }); vis(trackDone, trackOn);
    nodes.forEach((n, i) => {
      const on = at(t, lit[i] - 0.05, 0.3, ease.outCubic);
      n.style.borderColor = mix("rgba(242,239,223,0.34)".replace("rgba(242,239,223,0.34)", "#4B5561"), LIME, on);
      n.style.background = mix(NAVY, LIME, on);
      n.style.opacity = String(at(t, 8.3 + i * 0.1, 0.4) * (1 - at(t, 12.5, 0.4)) * (i === 2 ? 1 - at(t, 11.5, 0.2) : 1));
      vis(n, trackOn);
    });
    const ringP = at(t, 11.5, 0.5, ease.outCubic);
    tickRing.setAttribute("stroke-opacity", String(ringP * (1 - at(t, 12.5, 0.4))));
    tickRing.setAttribute("stroke-dasharray", "1000"); tickRing.setAttribute("stroke-dashoffset", String((1 - ringP) * 215));
    drawPath(tickPath, at(t, 11.75, 0.5, ease.inOutSine));
    tickPath.setAttribute("stroke-opacity", String(1 - at(t, 12.5, 0.4)));
    vis(tickSvg, t > 11.4 && t < 13.0);

    // ----- beat 3 -----
    const cardIn = at(t, 13.2, 0.9, rise);
    const cardOut = at(t, 16.3, 0.5, inOut);
    const dock = at(t, 16.3, 1.4, ease.inOutSine);
    const cardUp = (1 - cardIn) * 260;
    const dockX = 1600 - 1410, dockY = 640 - 500;
    card.style.opacity = String((cardIn > 0 ? 1 : 0) * (1 - at(t, 20.15, 0.45, ease.accelerate)));
    clipRect(card, cardIn, { from: "bottom" });
    card.style.transform = `translate(${lerp(0, dockX, dock)}px, ${cardUp + lerp(0, dockY, dock)}px) rotate(${lerp(-2.5, 0, dock)}deg) scale(${lerp(1, 0.62, dock)})`;
    vis(card, t > 13.15 && t < 20.7);
    clipRect(cardRule, at(t, 14.0, 0.4, ease.outCubic), { from: "left" });
    [cardTitle, cardLabA, cardLabB].forEach((e, i) => { e.style.opacity = String(at(t, 13.9 + [0, 0.2, 0.7][i], 0.35)); });
    barsA.forEach((b, i) => clipRect(b, at(t, 14.3 + i * 0.12, 0.45, ease.outCubic), { from: "left" }));
    barsB.forEach((b, i) => clipRect(b, at(t, 15.0 + i * 0.12, 0.45, ease.outCubic), { from: "left" }));
    const h3In = at(t, 13.25, 0.9, rise), h3Out = at(t, 16.05, 0.45, ease.accelerate);
    head3.inner.style.transform = `translateY(${(1 - h3In) * 112 + h3Out * 112}%)`;
    vis(head3.wrap, t > 13.2 && t < 16.6);
    const p3In = at(t, 13.55, 0.7, rise), p3Out = at(t, 16.35, 0.5, ease.accelerate);
    pane3.style.opacity = String(p3In * (1 - p3Out));
    pane3.style.transform = `translateY(${(1 - p3In) * 30 - p3Out * 20}px)`;
    vis(pane3, t > 13.5 && t < 17.0);
    const cStr = typed(COPY.cmd, t, 14.15, 16);
    cText.textContent = cStr;
    const cVis = cStr.length;
    const cmdLeft = 58 + 44 + 18 + 2 * L.charW;
    css(cmdCaret, { left: px(cmdLeft + cVis * L.charW + 2), top: px(70 + 9) });
    cmdCaret.style.opacity = String(t < 14.15 ? 0 : (t < 15.1 ? 1 : (t < 15.4 ? 0 : 0)));
    const bStr = typed(COPY.bye, t, 15.0, 18);
    byeLine.textContent = bStr;
    vis(byeLine, t > 14.95);

    // ----- beat 4 -----
    const h4In = at(t, 16.9, 0.9, rise), h4Out = at(t, 20.15, 0.4, ease.accelerate);
    head4.inner.style.transform = `translateY(${(1 - h4In) * 112 + h4Out * 112}%)`;
    vis(head4.wrap, t > 16.85 && t < 20.7);
    const p4In = at(t, 17.0, 0.8, rise), p4Out = at(t, 20.15, 0.5, ease.accelerate);
    pane4.style.opacity = String(p4In * (1 - p4Out));
    pane4.style.transform = `scale(${0.96 + 0.04 * p4In - 0.03 * p4Out})`;
    vis(pane4, t > 16.95 && t < 20.75);
    welMark.rowEls.forEach((r, i) => clipRect(r, at(t, 17.4 + i * 0.07, 0.4, ease.outCubic), { from: "left" }));
    welName.style.opacity = String(at(t, 17.6, 0.3)); welReady.style.opacity = String(at(t, 17.85, 0.3));
    const p4Str = typed(COPY.p4, t, 17.95, 40);
    p4Text.textContent = p4Str;
    css(p4Caret, { left: px(70 + 44 + 18 + 2 * L.charW + p4Str.length * L.charW + 3), top: px(416 + 9) });
    p4Caret.style.opacity = String(t < 17.9 ? 0 : (t < 18.85 ? 1 : 0));
    // link from the card to the prompt
    const linkU = at(t, 17.55, 0.7, ease.inOutSine);
    const a0 = [1290 + 0.62 * 60 * 0 + 60 - 20, 560], a1 = [P4.x + P4.w + 4, P4.y + 452];
    linkPath.setAttribute("d", `M1440 640 C 1380 640, 1330 ${P4.y + 452}, 1260 ${P4.y + 452}`);
    drawPath(linkPath, linkU);
    linkPath.setAttribute("stroke-opacity", String(1 - at(t, 20.1, 0.4)));
    vis(linkSvg, t > 17.5 && t < 20.6);

    // ----- beat 5 -----
    endParts.forEach((p, i) => { p.inner.style.transform = `translateY(${(1 - at(t, 20.75 + i * 0.14, 0.85, rise)) * 112}%)`; });
    vis(endWrap, t > 20.7);
    const ruleP = at(t, 21.3, 0.9, ease.inOutSine);
    css(endRule, { left: px(960 - 620 * ruleP), width: px(1240 * ruleP) }); vis(endRule, t > 21.25);
    endName.inner.style.transform = `translateY(${(1 - at(t, 21.65, 0.7, rise)) * 112}%)`;
    vis(endName.wrap, t > 21.6);
  }

  define({ width: 1920, height: 1080, fps: 60, duration: 23.2, render });
</script>
