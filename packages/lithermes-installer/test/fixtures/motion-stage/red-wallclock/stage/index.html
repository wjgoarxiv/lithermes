<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="/lit/fonts.css">
<style>html,body{margin:0;width:100vw;height:100vh;overflow:hidden;background:#111;font-family:"Pretendard"} #v{position:absolute;left:200px;top:400px;font-size:120px;color:#fff}</style></head>
<body><div id="v"></div><script src="/lit/stage-kit.js"></script>
<script>
const v = document.getElementById('v');
LitStage.define({ width: 1920, height: 1080, fps: 60, duration: 4, render(t) {
  const origin = Math.floor(performance.timeOrigin) % 100000;
  v.textContent = `${origin}`;
  document.body.style.background = `rgb(${origin % 256}, 40, 60)`;
} });
</script></body></html>
