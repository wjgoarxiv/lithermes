<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="/lit/fonts.css">
<style>
  html, body { margin: 0; width: 100vw; height: 100vh; overflow: hidden; background: #10243a; font-family: "Pretendard"; }
  #cap { position: absolute; left: 50%; top: 300px; transform: translateX(-50%); color: #f4f1ea; font-size: 80px; font-weight: 700; white-space: nowrap; }
  #tag { position: absolute; left: 8px; top: 8px; color: #1c2c40; font-size: 16px; }
  #meta { position: absolute; left: 240px; top: 800px; color: #f4f1ea; font-size: 40px; }
  #echo { position: absolute; left: 240px; top: 900px; color: #f4f1ea; font-size: 40px; }
  #frame { position: absolute; left: 1300px; top: 700px; color: #f4f1ea; font-size: 40px; }
  #frame i { display: inline-block; width: 120px; height: 60px; border: 6px solid currentColor; margin-left: 20px; vertical-align: middle; }
  canvas { position: absolute; left: 0; top: 0; }
</style></head>
<body><canvas id="cv" width="1920" height="1080"></canvas>
<div id="cap" data-lit-text="copy"></div>
<div id="tag" data-lit-text="decor">소금곶 1893</div>
<div id="echo" data-lit-text="decor">등대의 밤</div>
<div id="meta">treatment.json</div>
<div id="frame">창<i></i></div>
<script src="/lit/stage-kit.js"></script>
<script>
const COPY = { lines: ["등대의 밤", "빛이 돈다", "새벽"] };
const cap = document.getElementById('cap'), ctx = document.getElementById('cv').getContext('2d');
LitStage.define({ width: 1920, height: 1080, fps: 60, duration: 4, render(t) {
  cap.textContent = COPY.lines[Math.min(2, Math.floor(t / (4 / 3)))];
  ctx.clearRect(0, 0, 1920, 1080);
  ctx.fillStyle = '#2f5d50'; ctx.fillRect(0, 760 + 20 * Math.sin(t), 1920, 400);
  ctx.fillStyle = '#f4f1ea'; ctx.font = '48px Pretendard'; ctx.fillText('등대 일지', 1400, 200);
} });
</script></body></html>
