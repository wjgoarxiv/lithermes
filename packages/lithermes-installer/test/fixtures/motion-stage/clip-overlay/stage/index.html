<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="/lit/fonts.css">
<style>
  html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: #000; }
  #layer { position: absolute; inset: 0; }
</style>
</head>
<body>
<div id="layer"></div>
<script src="/lit/stage-kit.js"></script>
<script src="/lit/clips.js"></script>
<script>
  // One declared clip cued at 1.0 s, played once, then held until 1.5 s. Its frame depends on t alone.
  const swatch = LitStage.clip({ parent: document.getElementById("layer"), id: "swatch", box: { x: 600, y: 300, w: 400, h: 300 } });
  LitStage.define({ width: 1920, height: 1080, fps: 60, duration: 4, render(t) { swatch(t, { start: 1.0, hold: t < 1.5 }); } });
</script>
</body>
</html>
