<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="/lit/fonts.css">
<style>
  html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: #000; }
  #layer { position: absolute; inset: 0; }
</style>
</head>
<body>
<div id="layer"></div>
<script src="/lit/stage-kit.js"></script>
<script src="/lit/clips.js"></script>
<script>
  // A declared clip stretched over the whole frame, white then black on every frame: the flash audit must catch it.
  const strobe = LitStage.clip({ parent: document.getElementById("layer"), id: "strobe", box: { x: 0, y: 0, w: 1920, h: 1080 } });
  LitStage.define({ width: 1920, height: 1080, fps: 60, duration: 4, render(t) { strobe(t, { start: 0, loop: true }); } });
</script>
</body>
</html>
