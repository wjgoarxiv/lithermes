<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- Cover recipe: weight tide (type as material). Copy to DIR/cover/index.html and replace WORD
     and the motto. One rule: a letter's weight is a swell of the loop phase, offset by where the
     letter sits on screen. Rows of the word drift exactly one word per loop (alternate rows the
     other way), so the letters travel through the tide; the hero word never moves and the tide
     passes through it. A cursor steps under the hero letters on the beat. -->
<link rel="stylesheet" href="/lit/fonts.css">
<script src="/lit/loop-kit.js"></script>
<style>
  html, body { margin: 0; width: 1200px; height: 600px; overflow: hidden; background: #080d14; font-family: "JetBrains Mono"; }
  .row { position: absolute; left: 0; white-space: pre; font-size: 56px; line-height: 1; color: #1b2531; }
  .row span, #hero span { display: inline-block; }
  #band { position: absolute; left: 0; right: 0; top: 180px; height: 252px; background: #080d14; border-top: 2px solid #1f2a37; border-bottom: 2px solid #1f2a37; }
  #hero { position: absolute; left: 0; right: 0; top: 196px; text-align: center; font-size: 168px; line-height: 1; color: #f2efdf; white-space: pre; }
  #cursor { position: absolute; top: 364px; height: 9px; background: #ff6337; }
  #motto { position: absolute; left: 0; right: 0; top: 396px; text-align: center; font-size: 19px; letter-spacing: 9px; font-weight: 500; color: #8b8f8f; }
  #motto b { color: #ff6337; font-weight: 700; }
  body.mask, body.mask * { color: #000 !important; background: #000 !important; border-color: #000 !important; }
  body.mask #hero, body.mask #hero span { color: #fff !important; background: transparent !important; }
</style>
</head>
<body>
<div id="rows"></div>
<div id="band"></div>
<div id="hero"></div>
<div id="cursor"></div>
<div id="motto">KEEP THE WORK <b>LIT.</b></div>
<script>
const WORD = 'LITHERMES';
const { clamp, fract, mix, ease, swell, makeNoise, loopNoise, cubicPulse } = LitLoop;
const SIZE = 56, ADVANCE = 0.6 * SIZE, PITCH = 64, HERO = 168, HERO_ADVANCE = 0.6 * HERO;
const noise = makeNoise(7);
// The offset field: a diagonal sweep plus a per-row step, so the front is never a ruler line.
const offset = (x, y, row) => 0.85 * (x / 1200) + 0.35 * (y / 600) + 0.06 * row;
// gain() makes the weight dwell at light and at bold and turn quickly between them.
const tide = (t, off) => ease.gain(swell(fract(t - off)), 2.4);

const rows = Array.from({ length: 10 }, (_, r) => {
  const el = document.createElement('div');
  el.className = 'row';
  el.style.top = `${r * PITCH - 18}px`;
  const spans = [...`${WORD}·`.repeat(6)].map((ch) => { const s = document.createElement('span'); s.textContent = ch; el.appendChild(s); return s; });
  document.getElementById('rows').appendChild(el);
  return { el, spans, y: r * PITCH + 10, dir: r % 2 ? 1 : -1, r };
});
const hero = [...WORD].map((ch) => { const s = document.createElement('span'); s.textContent = ch; document.getElementById('hero').appendChild(s); return s; });
const heroLeft = (1200 - HERO_ADVANCE * WORD.length) / 2;
const cursor = document.getElementById('cursor');

window.renderFrame = (t, options = {}) => {
  document.body.className = options.mask ? 'mask' : '';
  const span = (WORD.length + 1) * ADVANCE;
  for (const row of rows) {
    // Exactly one word of travel per loop keeps the drift seamless; loop noise breathes each row.
    const shift = row.dir * span * t - 1.5 * span + 6 * loopNoise(noise, t, 3.1 * row.r, 0.9);
    row.el.style.transform = `translateX(${shift}px)`;
    const wobble = 0.05 * loopNoise(noise, t, 40 + row.r, 1.1);
    row.spans.forEach((s, i) => {
      const k = tide(t, offset(shift + (i + 0.5) * ADVANCE, row.y, row.r) + wobble);
      s.style.fontVariationSettings = `"wght" ${Math.round(mix(100, 800, k))}`;
      s.style.color = `rgb(${Math.round(mix(22, 46, k))},${Math.round(mix(31, 58, k))},${Math.round(mix(42, 74, k))})`;
    });
  }
  // The hero takes the same tide over a narrower range, so it never thins below a readable weight.
  hero.forEach((s, i) => { s.style.fontVariationSettings = `"wght" ${Math.round(mix(330, 800, tide(t, offset(heroLeft + (i + 0.5) * HERO_ADVANCE, 300, 4.5))))}`; });
  // Beat: the cursor dwells under each letter, steps on with an overshoot, and on its last stop
  // runs home like a carriage return.
  const stops = WORD.length + 1, x = t * stops, i = Math.floor(x), f = x - i;
  const at = i < stops - 1 ? i + ease.outBack(clamp((f - 0.62) / 0.38), 1.4) : WORD.length * (1 - ease.inCubic(clamp(f / 0.45)));
  cursor.style.left = `${heroLeft + Math.min(at, WORD.length) * HERO_ADVANCE + 6}px`;
  cursor.style.width = `${HERO_ADVANCE - 12}px`;
  cursor.style.opacity = String(1 - 0.75 * (i === stops - 1 ? 0 : cubicPulse(0.3, 0.12, f)));
};
Promise.all(['100 56px "JetBrains Mono"', '800 168px "JetBrains Mono"', '700 19px "JetBrains Mono"'].map((f) => document.fonts.load(f)))
  .then(() => document.fonts.ready).then(() => { window.renderFrame(0); window.ready = true; });
</script>
</body>
</html>
