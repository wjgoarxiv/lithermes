<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="/lit/fonts.css">
<script src="/lit/loop-kit.js"></script>
<style>
  html, body { margin: 0; width: 1200px; height: 600px; overflow: hidden; background: #080d14; color: #f2efdf; font-family: "JetBrains Mono"; }
  .mid { position: absolute; left: 0; right: 0; text-align: center; white-space: nowrap; }
  body.mask, body.mask * { background: #000 !important; color: #000 !important; border-color: #000 !important; }
  body.mask .title { color: #fff !important; }
</style>
</head>
<body>
<!-- NEGATIVE (never a recipe): the old type path as a cover. The title slams in, three lines
     appear one by one and hold, then everything crossfades to a settled end card. It must keep
     failing G2 (most of the loop is still) and G3 (the holds). -->
<div class="mid title" id="title" style="top:150px;font-size:110px;font-weight:800;letter-spacing:6px">LITHERMES</div>
<div class="mid" id="l1" style="top:330px;font-size:34px;font-weight:500">Plans before code.</div>
<div class="mid" id="l2" style="top:380px;font-size:34px;font-weight:500">Loops until green.</div>
<div class="mid" id="l3" style="top:430px;font-size:34px;font-weight:500;color:#ff6337">Evidence, not claims.</div>
<div class="mid" id="end" style="top:250px;font-size:64px;font-weight:700;opacity:0">KEEP THE WORK <span style="color:#ff6337">LIT.</span></div>
<script>
const { clamp, ease } = LitLoop, LENGTH = 10;
const rise = (s, at, dur) => ease.outCubic(clamp((s - at) / dur));
window.renderFrame = (t, options = {}) => {
  document.body.className = options.mask ? 'mask' : '';
  const s = t * LENGTH, gone = 1 - rise(s, 5.6, 0.4), title = document.getElementById('title');
  title.style.opacity = String(rise(s, 0.2, 0.5) * gone);
  title.style.transform = `scale(${1.25 - 0.25 * rise(s, 0.2, 0.5)})`;
  [2, 3, 4].forEach((at, i) => { const el = document.getElementById(`l${i + 1}`); el.style.opacity = String(rise(s, at, 0.3) * gone); el.style.transform = `translateY(${12 * (1 - rise(s, at, 0.3))}px)`; });
  document.getElementById('end').style.opacity = String(rise(s, 6.1, 0.5) * (1 - rise(s, 9.6, 0.4)));
};
document.fonts.load('800 110px "JetBrains Mono"').then(() => document.fonts.ready).then(() => { window.renderFrame(0); window.ready = true; });
</script>
</body>
</html>
