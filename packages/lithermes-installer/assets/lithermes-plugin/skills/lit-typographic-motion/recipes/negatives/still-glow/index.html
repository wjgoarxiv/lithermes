<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="/lit/fonts.css">
<script src="/lit/loop-kit.js"></script>
<style>
  html, body { margin: 0; width: 1200px; height: 600px; overflow: hidden; background: #080d14; color: #f2efdf; font-family: "JetBrains Mono"; }
  .mid { position: absolute; left: 0; right: 0; text-align: center; white-space: nowrap; }
  body.mask, body.mask * { background: #000 !important; color: #000 !important; border-color: #000 !important; }
  body.mask .title { color: #fff !important; }
</style>
</head>
<body>
<!-- NEGATIVE (never a recipe): a still with a faint breathing glow, which is what relighting a
     picture becomes without moving edges. The encoder drops the slow fade, so the decoded loop
     barely moves. It must keep failing G2 and G3. -->
<div class="mid" id="glow" style="top:0;height:600px;background:radial-gradient(ellipse at 50% 45%, #ff633722, transparent 60%)"></div>
<div class="mid title" style="top:210px;font-size:110px;font-weight:800;letter-spacing:6px">LITHERMES</div>
<div class="mid" style="top:360px;font-size:28px;font-weight:500">KEEP THE WORK <span style="color:#ff6337">LIT.</span></div>
<script>
window.renderFrame = (t, options = {}) => {
  document.body.className = options.mask ? 'mask' : '';
  document.getElementById('glow').style.opacity = String(0.75 + 0.25 * Math.sin(LitLoop.TAU * t));
};
document.fonts.load('800 110px "JetBrains Mono"').then(() => document.fonts.ready).then(() => { window.renderFrame(0); window.ready = true; });
</script>
</body>
</html>
