name: Publish (manual, version-guarded)

# Publishing is NEVER automatic. This workflow runs ONLY on manual dispatch and
# refuses unless the dispatch targets main at the exact reviewed commit and the
# input version exactly equals package.json version. It is never triggered by push or tag.
# It is the stronger Linux descriptor-sealed exact-artifact option and requires NPM_TOKEN.
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (must equal packages/lithermes-installer/package.json version)'
        required: true
      commit:
        description: 'Reviewed origin/main commit (full canonical SHA)'
        required: true

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/lithermes-installer
    steps:
      - uses: actions/checkout@v4
      - name: Dispatch identity guard (exact reviewed main commit)
        env:
          DISPATCH_REF: ${{ github.ref }}
          DISPATCH_SHA: ${{ github.sha }}
          REQUESTED_COMMIT: ${{ github.event.inputs.commit }}
        run: |
          if [ "$DISPATCH_REF" != "refs/heads/main" ]; then
            echo "Refusing: dispatch ref is not refs/heads/main"
            exit 1
          fi
          if ! [[ "$REQUESTED_COMMIT" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Refusing: commit input is not a canonical full SHA"
            exit 1
          fi
          if [ "$REQUESTED_COMMIT" != "$DISPATCH_SHA" ]; then
            echo "Refusing: reviewed commit does not equal the workflow commit"
            exit 1
          fi
          echo "Dispatch identity guard passed: $DISPATCH_SHA"
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Python test dependencies
        run: python -m pip install PyYAML==6.0.3 jsonschema==4.26.0
      - name: Install Node dependencies
        run: npm ci
      - name: Version guard (dispatch input must equal package.json version)
        env:
          REQUESTED_VERSION: ${{ github.event.inputs.version }}
        run: |
          PKG_VERSION="$(node -p "require('./package.json').version")"
          if [ "$REQUESTED_VERSION" != "$PKG_VERSION" ]; then
            echo "Refusing: requested '$REQUESTED_VERSION' != package.json '$PKG_VERSION'"
            exit 1
          fi
          echo "Version guard passed: $PKG_VERSION"
      - name: Gates (must pass before publish)
        run: |
          npm test
          npm run test:python
          node test/scripts/scan-forbidden-tokens.js --tracked
          node test/scripts/scan-forbidden-tokens.js --package-root
          npm run qa:real-surface
      - name: Pack, scan, descriptor-seal, and publish exact artifact
        run: |
          PACK_DIR="$(mktemp -d "${RUNNER_TEMP}/lithermes-publish-pack.XXXXXX")"
          HANDOFF_DIR=""
          cleanup() {
            if [ -n "${HANDOFF_DIR:-}" ] && [ -d "$HANDOFF_DIR" ]; then
              chmod 700 "$HANDOFF_DIR" || true
            fi
            if [ -n "${PUBLISH_FD:-}" ]; then exec {PUBLISH_FD}<&-; fi
            rm -rf "$PACK_DIR"
          }
          trap cleanup EXIT
          npm pack --ignore-scripts --json --pack-destination "$PACK_DIR" > "$PACK_DIR/pack.json"
          ARCHIVE="$(node -e 'const fs=require("node:fs"),path=require("node:path"); const p=JSON.parse(fs.readFileSync(process.argv[1],"utf8")); process.stdout.write(path.join(process.argv[2],p[0].filename));' "$PACK_DIR/pack.json" "$PACK_DIR")"
          VALIDATED_ARCHIVE="$PACK_DIR/validated.tgz"
          SCAN_REPORT="$PACK_DIR/scan.json"
          node test/scripts/scan-forbidden-tokens.js --pack-tar "$ARCHIVE" --snapshot-out "$VALIDATED_ARCHIVE" --json > "$SCAN_REPORT"
          VALIDATED_DIGEST="$(node -e 'const fs=require("node:fs"); const r=JSON.parse(fs.readFileSync(process.argv[1],"utf8")); if (!r.ok || !/^[a-f0-9]{64}$/.test(r.validatedArchive?.sha256 || "")) process.exit(1); process.stdout.write(r.validatedArchive.sha256);' "$SCAN_REPORT")"
          exec {PUBLISH_FD}<"$VALIDATED_ARCHIVE"
          rm -f "$VALIDATED_ARCHIVE"
          PUBLISH_ENDPOINT="/proc/$$/fd/$PUBLISH_FD"
          HANDOFF_DIR="$PACK_DIR/handoff"
          SEALED_ARCHIVE="$HANDOFF_DIR/validated.tgz"
          mkdir "$HANDOFF_DIR"
          chmod 700 "$HANDOFF_DIR"
          ln -s "$PUBLISH_ENDPOINT" "$SEALED_ARCHIVE"
          chmod 500 "$HANDOFF_DIR"
          SEALED_DIGEST="$(sha256sum "$PUBLISH_ENDPOINT" | cut -d ' ' -f 1)"
          if [ "$SEALED_DIGEST" != "$VALIDATED_DIGEST" ]; then
            echo "Refusing: sealed publish descriptor does not match validated archive digest"
            exit 1
          fi
          npm publish "$SEALED_ARCHIVE" --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
